# ISO/IEC 27001:2022 Annex A — shipped with kilagen.
#
# Reference-not-copy: each control carries its published reference and title,
# because the title is what makes the reference readable. No control text is
# reproduced — that is behind `resources`, at ISO's own URL.
#
# All 93 Annex A controls, in the four 2022 themes. The whole set is listed on
# purpose: a partial list would flatter coverage by shrinking the denominator.
#
# The id is the edition. A 2027 revision is a new id, not an edit of this file.

name: ISO/IEC 27001:2022
description: >
  The international standard for an information security management system.
  Annex A is its reference set of 93 controls, reorganised in the 2022 edition
  into four themes; an organisation selects from it and justifies what it
  leaves out in a Statement of Applicability.
granularity: All 93 Annex A controls of the 2022 edition.

resources:
  - name: ISO/IEC 27001:2022
    url: https://www.iso.org/standard/27001
  - name: ISO/IEC 27002:2022 — implementation guidance for the same controls
    url: https://www.iso.org/standard/75652.html

groups:
