# Capabilities for the IAM domain.
#
# A starting inventory: what this domain can cover, with every capability at
# L0-none. L0 means the capability is acknowledged and nothing has been built
# for it yet — the honest state of a new program. Raise the maturity as each
# one becomes real, list the systems that implement it, and delete the ones
# that do not apply to you.
#
# See keel/maturity.md for the scale and its graduation criteria.

domain: iam

capabilities:
  - id: idp
    name: Identity Provider (IdP)
    summary: >
      Centralized authentication and identity management for all users.
    why: >
      Single source of truth for identity, enforcing MFA and SSO across all
      services.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Workforce identities and single sign-on to integrated applications.
    lenses: [nist:PR.AA]
    last_reviewed: 2026-01-01

  - id: iga
    name: Identity Governance and Administration (IGA)
    summary: >
      Lifecycle governance of standard user access — joiner/mover/leaver
      provisioning, periodic recertification, role management, and orphan
      account detection.
    why: >
      Ensures least privilege and provides auditable evidence of access
      reviews for compliance.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Lifecycle governance of user entitlements, periodic access
      recertification, role management, and orphan account detection across
      corporate and production systems.
    lenses: [nist:PR.AA]
    last_reviewed: 2026-01-01

  - id: pam
    name: Privileged Access Management (PAM)
    summary: >
      Same governance discipline as IGA but for high-risk access —
      just-in-time elevation, session recording, and break-glass procedures
      for administrative actions.
    why: >
      Limits standing privileges and provides audit trail for all
      administrative access. Stricter controls than standard access:
      time-limited, logged, approval-gated.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Administrative and highly privileged access to production
      infrastructure, consoles and databases.
    lenses: [nist:PR.AA]
    last_reviewed: 2026-01-01

  - id: secrets-management
    name: Secrets Management
    summary: >
      Secure storage and rotation of secrets for humans and applications.
    why: >
      Prevents credential sprawl and ensures secrets are rotated and
      auditable.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Storage, distribution and rotation of credentials and API keys for
      human operators and application workloads.
    lenses: [nist:PR.AA, nist:PR.DS]
    last_reviewed: 2026-01-01

  - id: pki
    name: PKI / Certificate Management
    summary: >
      Public key infrastructure and TLS certificate lifecycle management.
    why: >
      Ensures encrypted communications and automated certificate renewal to
      prevent outages.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Issuance, renewal and revocation of TLS certificates for public and
      internal endpoints.
    lenses: [nist:PR.AA, nist:PR.DS]
    last_reviewed: 2026-01-01
