# Capabilities for the Digital Assets domain.
#
# A starting inventory: what this domain can cover, with every capability at
# L0-none. L0 means the capability is acknowledged and nothing has been built
# for it yet — the honest state of a new program. Raise the maturity as each
# one becomes real, list the systems that implement it, and delete the ones
# that do not apply to you.
#
# See keel/maturity.md for the scale and its graduation criteria.

domain: digital-assets

capabilities:
  - id: custody
    name: Custody & Key Management
    summary: >
      Secure custody of digital asset private keys, including key
      ceremonies, signer enrollment, multi-signature governance, and
      policy-based transaction controls.
    why: >
      If custody is compromised, client funds are lost irreversibly. Every
      other security control is secondary to this.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Key generation and backup, signer enrollment, transaction
      authorization policy, and multi-signature governance.
    lenses: [nist:PR.DS, nist:PR.AA]
    last_reviewed: 2026-01-01

  - id: smart-contracts
    name: Smart Contract Security
    summary: >
      Security controls around smart contract development, review and
      deployment.
    why: >
      Smart contract vulnerabilities can result in irreversible loss of
      funds; deployment must be controlled and auditable.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Contract source review, deployment pipelines, and post-deployment
      monitoring.
    lenses: [nist:PR.PS, nist:DE.CM]
    last_reviewed: 2026-01-01

  - id: on-chain-monitoring
    name: On-Chain Monitoring / KYT
    summary: >
      Blockchain transaction monitoring for suspicious activity and
      counterparty screening.
    why: >
      Regulatory requirement and operational necessity — detect and flag
      suspicious transactions in real time.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All on-chain transactions and counterparties.
    lenses: [nist:DE.CM]
    last_reviewed: 2026-01-01
