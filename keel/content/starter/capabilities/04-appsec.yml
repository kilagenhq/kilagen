# Capabilities for the AppSec domain.
#
# A starting inventory: what this domain can cover, with every capability at
# L0-none. L0 means the capability is acknowledged and nothing has been built
# for it yet — the honest state of a new program. Raise the maturity as each
# one becomes real, list the systems that implement it, and delete the ones
# that do not apply to you.
#
# See keel/maturity.md for the scale and its graduation criteria.

domain: appsec

capabilities:
  - id: sast
    name: Static Application Security Testing (SAST)
    summary: >
      Scanning source code for vulnerabilities before deployment.
    why: >
      Catches security bugs early in the SDLC, before they reach production.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All source code repositories.
    lenses: [nist:PR.PS]
    last_reviewed: 2026-01-01

  - id: sca
    name: Software Composition Analysis (SCA)
    summary: >
      Identifying known vulnerabilities in third-party dependencies.
    why: >
      Third-party libraries are a major attack surface; SCA ensures known
      CVEs are flagged and patched.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All source code repositories and their dependency manifests.
    lenses: [nist:PR.PS]
    last_reviewed: 2026-01-01

  - id: secrets-scanning
    name: Secrets Scanning
    summary: >
      Scanning repositories for accidentally committed credentials and API
      keys.
    why: >
      Prevents credential leaks that could lead to account compromise or
      data breach.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All source code repositories, including their history.
    lenses: [nist:PR.PS, nist:PR.DS]
    last_reviewed: 2026-01-01

  - id: iac-scanning
    name: Infrastructure as Code Scanning
    summary: >
      Scanning infrastructure-as-code templates and manifests for
      misconfigurations and vulnerabilities.
    why: >
      Catches infrastructure misconfigurations before they are deployed to
      production.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All repositories holding infrastructure-as-code definitions.
    lenses: [nist:PR.PS]
    last_reviewed: 2026-01-01

  - id: dast
    name: Dynamic Application Security Testing (DAST)
    summary: >
      Testing running applications for vulnerabilities by probing exposed
      endpoints.
    why: >
      Finds vulnerabilities that static analysis misses — runtime issues,
      middleware CVEs, and configuration errors.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Web applications and APIs in pre-production and production
      environments.
    lenses: [nist:PR.PS]
    last_reviewed: 2026-01-01

  - id: api-security
    name: API Security Testing
    summary: >
      Testing APIs against their published specifications for contract
      violations and security flaws.
    why: >
      APIs are the primary attack surface; automated testing catches auth
      bypass, injection, and contract violations.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All externally reachable APIs and their specifications.
    lenses: [nist:PR.PS]
    last_reviewed: 2026-01-01

  - id: ai-code-review
    name: AI-Assisted Code Review
    summary: >
      Developers use an AI assistant to review their own changes for
      security issues before opening a pull request.
    why: >
      Scales security review beyond what the team can manually cover,
      catching issues at development time.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Changes to application and infrastructure code, before review.
    lenses: [nist:PR.PS]
    last_reviewed: 2026-01-01
