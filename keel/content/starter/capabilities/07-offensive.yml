# Capabilities for the Offensive domain.
#
# A starting inventory: what this domain can cover, with every capability at
# L0-none. L0 means the capability is acknowledged and nothing has been built
# for it yet — the honest state of a new program. Raise the maturity as each
# one becomes real, list the systems that implement it, and delete the ones
# that do not apply to you.
#
# See keel/maturity.md for the scale and its graduation criteria.

domain: offensive

capabilities:
  - id: external-pentest
    name: External Penetration Testing
    summary: >
      Contracted external penetration testing of the organisation's attack
      surface.
    why: >
      Independent validation of defences by skilled adversaries — finds what
      automated tools miss.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Public-facing infrastructure and applications, on a recurring
      schedule.
    lenses: [nist:ID.RA]
    last_reviewed: 2026-01-01

  - id: bug-bounty
    name: Bug Bounty / VDP
    summary: >
      External vulnerability disclosure program allowing security
      researchers to report vulnerabilities.
    why: >
      Continuous external testing by a broad community — complements
      periodic pentests with ongoing coverage.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Production services reachable by external researchers.
    lenses: [nist:ID.RA]
    last_reviewed: 2026-01-01

  - id: internal-offensive
    name: Internal Offensive Testing
    summary: >
      Internal adversary simulation — red team exercises, breach and attack
      simulation, and supporting tooling.
    why: >
      Validates that detection and prevention controls actually work against
      realistic attack scenarios.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Internally run adversary simulation against production and corporate
      environments.
    lenses: [nist:ID.RA]
    last_reviewed: 2026-01-01
