# Capabilities for the Incident Response domain.
#
# A starting inventory: what this domain can cover, with every capability at
# L0-none. L0 means the capability is acknowledged and nothing has been built
# for it yet — the honest state of a new program. Raise the maturity as each
# one becomes real, list the systems that implement it, and delete the ones
# that do not apply to you.
#
# See keel/maturity.md for the scale and its graduation criteria.

domain: ir

capabilities:
  - id: incident-management
    name: Incident Management Platform
    summary: >
      Tracking the incident lifecycle from detection through resolution,
      including severity, timeline, and linked tickets.
    why: >
      Structured incident tracking ensures consistent response and
      regulatory compliance.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All security incidents, from declaration to postmortem.
    lenses: [nist:RS.MA, nist:RS.CO]
    last_reviewed: 2026-01-01

  - id: dfir-tooling
    name: DFIR Tooling
    summary: >
      Digital forensics and incident response tooling for remote
      investigation and evidence collection.
    why: >
      Enables rapid remote investigation and containment without requiring
      physical access to endpoints.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Remote investigation and evidence collection across endpoints and
      cloud workloads.
    lenses: [nist:RS.AN, nist:RS.MI]
    last_reviewed: 2026-01-01
