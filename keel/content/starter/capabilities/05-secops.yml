# Capabilities for the SecOps domain.
#
# A starting inventory: what this domain can cover, with every capability at
# L0-none. L0 means the capability is acknowledged and nothing has been built
# for it yet — the honest state of a new program. Raise the maturity as each
# one becomes real, list the systems that implement it, and delete the ones
# that do not apply to you.
#
# See keel/maturity.md for the scale and its graduation criteria.

domain: secops

capabilities:
  - id: siem
    name: Security Information and Event Management (SIEM)
    summary: >
      Centralized log aggregation, correlation, and alerting across all
      security-relevant sources.
    why: >
      The central bus for all security signals — without it, detection and
      response are blind.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All security-relevant log sources across corporate and production
      environments.
    lenses: [nist:DE.CM]
    last_reviewed: 2026-01-01

  - id: detection-engineering
    name: Detection Engineering
    summary: >
      Custom detection rule development and maintenance, managed as
      detection-as-code.
    why: >
      Vendor default detections miss business-specific threats; custom rules
      close the gap.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Detection content across all monitored telemetry sources.
    lenses: [nist:DE.AE]
    last_reviewed: 2026-01-01

  - id: threat-intelligence
    name: Threat Intelligence
    summary: >
      Threat intelligence feeds, lookalike-domain monitoring, and indicator
      management.
    why: >
      Early warning of threats targeting the organization — brand abuse,
      phishing preparation, and known indicators.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      External threat feeds, brand monitoring, and indicator enrichment.
    lenses: [nist:DE.CM, nist:ID.RA]
    last_reviewed: 2026-01-01

  - id: deception
    name: Deception / Honeytokens
    summary: >
      Deception technology deployed to detect attacker presence via
      tripwires and canary tokens.
    why: >
      High-fidelity, low-false-positive detection — any trigger is
      suspicious by definition.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Decoy credentials, files and tokens placed across corporate and
      production environments.
    lenses: [nist:DE.CM]
    last_reviewed: 2026-01-01

  - id: ai-soc-triage
    name: AI SOC Triage
    summary: >
      AI-powered first-pass triage of security alerts before human review.
    why: >
      Reduces alert fatigue and accelerates response by automating initial
      triage decisions.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Inbound security alerts prior to analyst review.
    lenses: [nist:DE.AE]
    last_reviewed: 2026-01-01

  - id: soar
    name: Security Orchestration, Automation, and Response (SOAR)
    summary: >
      Automated playbook execution for common security response actions.
    why: >
      Reduces mean time to respond by automating repetitive response tasks.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Repeatable response actions triggered by detections.
    lenses: [nist:RS.MI]
    last_reviewed: 2026-01-01

  - id: case-management
    name: Ticketing / Case Management
    summary: >
      Ticketing for tracking security work — vulnerabilities, incidents,
      compliance tasks, exceptions, and access reviews.
    why: >
      Central tracking ensures nothing falls through the cracks and provides
      audit trail for all security work.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All security work items, from detection through closure.
    lenses: [nist:DE.AE, nist:RS.MA]
    last_reviewed: 2026-01-01
