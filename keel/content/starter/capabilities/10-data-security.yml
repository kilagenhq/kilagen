# Capabilities for the Data Security domain.
#
# A starting inventory: what this domain can cover, with every capability at
# L0-none. L0 means the capability is acknowledged and nothing has been built
# for it yet — the honest state of a new program. Raise the maturity as each
# one becomes real, list the systems that implement it, and delete the ones
# that do not apply to you.
#
# See keel/maturity.md for the scale and its graduation criteria.

domain: data-security

capabilities:
  - id: data-classification
    name: Data Classification & Discovery
    summary: >
      Identifying, labelling, and inventorying sensitive data across all
      storage systems, including posture monitoring.
    why: >
      You cannot protect data you have not identified — classification is
      the foundation of data security.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All data stores holding company or customer data.
    lenses: [nist:PR.DS, nist:ID.AM]
    last_reviewed: 2026-01-01

  - id: dlp
    name: Data Loss Prevention (DLP)
    summary: >
      Preventing unauthorized exfiltration of sensitive data from corporate
      systems.
    why: >
      Protects against insider threats and accidental data leaks that could
      trigger regulatory action.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Corporate collaboration, endpoint and email channels.
    lenses: [nist:PR.DS]
    last_reviewed: 2026-01-01

  - id: backup-dr
    name: Backup & Disaster Recovery
    summary: >
      Backup procedures and disaster recovery plans for critical systems.
    why: >
      Last line of defense against ransomware and catastrophic failure.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All systems classified as critical, and the data they hold.
    lenses: [nist:PR.IR, nist:RC.RP]
    last_reviewed: 2026-01-01
