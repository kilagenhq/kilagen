# Capabilities for the Infrastructure domain.
#
# A starting inventory: what this domain can cover, with every capability at
# L0-none. L0 means the capability is acknowledged and nothing has been built
# for it yet — the honest state of a new program. Raise the maturity as each
# one becomes real, list the systems that implement it, and delete the ones
# that do not apply to you.
#
# See keel/maturity.md for the scale and its graduation criteria.

domain: infra

capabilities:
  - id: cspm
    name: Cloud Security Posture Management (CSPM)
    summary: >
      Continuous assessment of cloud infrastructure configuration against
      security baselines.
    why: >
      Detects cloud misconfigurations before they become exploitable attack
      surface.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All cloud accounts and subscriptions in use.
    lenses: [nist:PR.PS]
    last_reviewed: 2026-01-01

  - id: container-security
    name: Container / Workload Protection (CWPP)
    summary: >
      Image scanning in the build pipeline, registry scanning, and runtime
      protection for container workloads.
    why: >
      Prevents deploying vulnerable container images and detects runtime
      threats in orchestrated workloads.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Build pipelines, container registries, and container runtime
      environments.
    lenses: [nist:PR.PS]
    last_reviewed: 2026-01-01

  - id: edr
    name: Endpoint Detection and Response (EDR)
    summary: >
      Real-time endpoint monitoring, detection, and response on all
      corporate devices and servers.
    why: >
      Primary defense against endpoint compromise — detects and enables
      rapid response to threats on hosts.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All corporate endpoints: laptops, servers and cloud instances.
    lenses: [nist:PR.PS, nist:DE.CM]
    last_reviewed: 2026-01-01

  - id: network-security
    name: Network Security
    summary: >
      Network-level protections including web application firewalling, edge
      and ingress controls, service-to-service encryption, and secure remote
      access.
    why: >
      Protects production services from external attacks and limits lateral
      movement.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Edge and ingress controls, internal service traffic, and remote access
      paths.
    lenses: [nist:PR.PS]
    last_reviewed: 2026-01-01

  - id: vuln-management-infra
    name: Infrastructure Vulnerability Management
    summary: >
      Host-level CVE scanning and remediation tracking for infrastructure
      components.
    why: >
      Ensures known vulnerabilities on hosts are identified and patched
      within SLA.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      Host-level vulnerabilities across servers, cloud instances and
      endpoints.
    lenses: [nist:ID.RA, nist:PR.PS]
    last_reviewed: 2026-01-01

  - id: mdm
    name: Mobile Device Management (MDM)
    summary: >
      Endpoint management, compliance enforcement, and software deployment
      for corporate devices.
    why: >
      Ensures corporate devices meet security baselines: disk encryption, OS
      patching and approved software.
    maturity: L0-none
    systems: []
    owner: role-security-owner
    scope: >
      All corporate-managed devices.
    lenses: [nist:PR.PS, nist:ID.AM]
    last_reviewed: 2026-01-01
