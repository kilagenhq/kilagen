# The capability vocabulary for this program — one file, the whole menu.
#
# A capability is two things and nothing more: the checklist of what a security
# program can build, and the facet that groups documents by domain. It carries no
# assessment. What is actually deployed, on which systems, at what quality, is
# measured in the estate — not here. The reasoning ships with the framework:
# see "Why Kilagen is this way" under Reference in the built site.
#
# Ids are namespaced <domain>.<capability>, which makes them unique across the
# program by construction. Delete the ones that do not apply to you.

capabilities:
  - id: grc.policy-lifecycle
    name: Policy and Standard Lifecycle
    domain: grc
    description: >
      Authoring, approval, versioning and scheduled review of policies and
      standards.
    why: >
      Documents nobody reviews stop describing what the organisation actually
      does, and an auditor can tell.

  - id: grc.risk-management
    name: Risk Management
    domain: grc
    description: >
      A maintained register of security risks with severity, treatment and
      ownership.
    why: >
      Prioritisation without a register is prioritisation by whoever argues
      loudest.

  - id: grc.compliance-mapping
    name: Compliance Mapping
    domain: grc
    description: >
      Mapping requirements to the clauses of each framework in scope, and
      tracking coverage.
    why: >
      Answering an auditor from the same source of truth the engineers work
      from, rather than a spreadsheet rebuilt each cycle.

  - id: grc.exception-management
    name: Exception Management
    domain: grc
    description: >
      Approved, time-bounded deviations from a standard, with compensating
      controls recorded.
    why: >
      Undocumented deviations are indistinguishable from failures; a dated
      exception makes the decision visible and forces re-evaluation.

  - id: grc.gap-management
    name: Gap Management
    domain: grc
    description: >
      Tracking unapproved shortfalls against requirements through to
      remediation.
    why: >
      A gap that is not written down is a gap nobody owns.

  - id: grc.third-party-risk
    name: Third-Party Risk Management
    domain: grc
    description: >
      Assessment and periodic review of the security posture of vendors and
      service providers.
    why: >
      Third parties inherit access to data and systems; their weaknesses become
      the organisation's.

  - id: iam.idp
    name: Identity Provider (IdP)
    domain: iam
    description: >
      Centralized authentication and identity management for all users.
    why: >
      Single source of truth for identity, enforcing MFA and SSO across all
      services.

  - id: iam.iga
    name: Identity Governance and Administration (IGA)
    domain: iam
    description: >
      Lifecycle governance of standard user access — joiner/mover/leaver
      provisioning, periodic recertification, role management, and orphan
      account detection.
    why: >
      Ensures least privilege and provides auditable evidence of access reviews
      for compliance.

  - id: iam.pam
    name: Privileged Access Management (PAM)
    domain: iam
    description: >
      Same governance discipline as IGA but for high-risk access — just-in-time
      elevation, session recording, and break-glass procedures for
      administrative actions.
    why: >
      Limits standing privileges and provides audit trail for all administrative
      access. Stricter controls than standard access: time-limited, logged,
      approval-gated.

  - id: iam.secrets-management
    name: Secrets Management
    domain: iam
    description: >
      Secure storage and rotation of secrets for humans and applications.
    why: >
      Prevents credential sprawl and ensures secrets are rotated and auditable.

  - id: iam.pki
    name: PKI / Certificate Management
    domain: iam
    description: >
      Public key infrastructure and TLS certificate lifecycle management.
    why: >
      Ensures encrypted communications and automated certificate renewal to
      prevent outages.

  - id: infra.cspm
    name: Cloud Security Posture Management (CSPM)
    domain: infra
    description: >
      Continuous assessment of cloud infrastructure configuration against
      security baselines.
    why: >
      Detects cloud misconfigurations before they become exploitable attack
      surface.

  - id: infra.container-security
    name: Container / Workload Protection (CWPP)
    domain: infra
    description: >
      Image scanning in the build pipeline, registry scanning, and runtime
      protection for container workloads.
    why: >
      Prevents deploying vulnerable container images and detects runtime threats
      in orchestrated workloads.

  - id: infra.edr
    name: Endpoint Detection and Response (EDR)
    domain: infra
    description: >
      Real-time endpoint monitoring, detection, and response on all corporate
      devices and servers.
    why: >
      Primary defense against endpoint compromise — detects and enables rapid
      response to threats on hosts.

  - id: infra.network-security
    name: Network Security
    domain: infra
    description: >
      Network-level protections including web application firewalling, edge and
      ingress controls, service-to-service encryption, and secure remote access.
    why: >
      Protects production services from external attacks and limits lateral
      movement.

  - id: infra.vuln-management-infra
    name: Infrastructure Vulnerability Management
    domain: infra
    description: >
      Host-level CVE scanning and remediation tracking for infrastructure
      components.
    why: >
      Ensures known vulnerabilities on hosts are identified and patched within
      SLA.

  - id: infra.mdm
    name: Mobile Device Management (MDM)
    domain: infra
    description: >
      Endpoint management, compliance enforcement, and software deployment for
      corporate devices.
    why: >
      Ensures corporate devices meet security baselines: disk encryption, OS
      patching and approved software.

  - id: appsec.sast
    name: Static Application Security Testing (SAST)
    domain: appsec
    description: >
      Scanning source code for vulnerabilities before deployment.
    why: >
      Catches security bugs early in the SDLC, before they reach production.

  - id: appsec.sca
    name: Software Composition Analysis (SCA)
    domain: appsec
    description: >
      Identifying known vulnerabilities in third-party dependencies.
    why: >
      Third-party libraries are a major attack surface; SCA ensures known CVEs
      are flagged and patched.

  - id: appsec.secrets-scanning
    name: Secrets Scanning
    domain: appsec
    description: >
      Scanning repositories for accidentally committed credentials and API keys.
    why: >
      Prevents credential leaks that could lead to account compromise or data
      breach.

  - id: appsec.iac-scanning
    name: Infrastructure as Code Scanning
    domain: appsec
    description: >
      Scanning infrastructure-as-code templates and manifests for
      misconfigurations and vulnerabilities.
    why: >
      Catches infrastructure misconfigurations before they are deployed to
      production.

  - id: appsec.dast
    name: Dynamic Application Security Testing (DAST)
    domain: appsec
    description: >
      Testing running applications for vulnerabilities by probing exposed
      endpoints.
    why: >
      Finds vulnerabilities that static analysis misses — runtime issues,
      middleware CVEs, and configuration errors.

  - id: appsec.api-security
    name: API Security Testing
    domain: appsec
    description: >
      Testing APIs against their published specifications for contract
      violations and security flaws.
    why: >
      APIs are the primary attack surface; automated testing catches auth
      bypass, injection, and contract violations.

  - id: appsec.ai-code-review
    name: AI-Assisted Code Review
    domain: appsec
    description: >
      Developers use an AI assistant to review their own changes for security
      issues before opening a pull request.
    why: >
      Scales security review beyond what the team can manually cover, catching
      issues at development time.

  - id: secops.siem
    name: Security Information and Event Management (SIEM)
    domain: secops
    description: >
      Centralized log aggregation, correlation, and alerting across all
      security-relevant sources.
    why: >
      The central bus for all security signals — without it, detection and
      response are blind.

  - id: secops.detection-engineering
    name: Detection Engineering
    domain: secops
    description: >
      Custom detection rule development and maintenance, managed as detection-
      as-code.
    why: >
      Vendor default detections miss business-specific threats; custom rules
      close the gap.

  - id: secops.threat-intelligence
    name: Threat Intelligence
    domain: secops
    description: >
      Threat intelligence feeds, lookalike-domain monitoring, and indicator
      management.
    why: >
      Early warning of threats targeting the organization — brand abuse,
      phishing preparation, and known indicators.

  - id: secops.deception
    name: Deception / Honeytokens
    domain: secops
    description: >
      Deception technology deployed to detect attacker presence via tripwires
      and canary tokens.
    why: >
      High-fidelity, low-false-positive detection — any trigger is suspicious by
      definition.

  - id: secops.ai-soc-triage
    name: AI SOC Triage
    domain: secops
    description: >
      AI-powered first-pass triage of security alerts before human review.
    why: >
      Reduces alert fatigue and accelerates response by automating initial
      triage decisions.

  - id: secops.soar
    name: Security Orchestration, Automation, and Response (SOAR)
    domain: secops
    description: >
      Automated playbook execution for common security response actions.
    why: >
      Reduces mean time to respond by automating repetitive response tasks.

  - id: secops.case-management
    name: Ticketing / Case Management
    domain: secops
    description: >
      Ticketing for tracking security work — vulnerabilities, incidents,
      compliance tasks, exceptions, and access reviews.
    why: >
      Central tracking ensures nothing falls through the cracks and provides
      audit trail for all security work.

  - id: ir.incident-management
    name: Incident Management Platform
    domain: ir
    description: >
      Tracking the incident lifecycle from detection through resolution,
      including severity, timeline, and linked tickets.
    why: >
      Structured incident tracking ensures consistent response and regulatory
      compliance.

  - id: ir.dfir-tooling
    name: DFIR Tooling
    domain: ir
    description: >
      Digital forensics and incident response tooling for remote investigation
      and evidence collection.
    why: >
      Enables rapid remote investigation and containment without requiring
      physical access to endpoints.

  - id: offensive.external-pentest
    name: External Penetration Testing
    domain: offensive
    description: >
      Contracted external penetration testing of the organisation's attack
      surface.
    why: >
      Independent validation of defences by skilled adversaries — finds what
      automated tools miss.

  - id: offensive.bug-bounty
    name: Bug Bounty / VDP
    domain: offensive
    description: >
      External vulnerability disclosure program allowing security researchers to
      report vulnerabilities.
    why: >
      Continuous external testing by a broad community — complements periodic
      pentests with ongoing coverage.

  - id: offensive.internal-offensive
    name: Internal Offensive Testing
    domain: offensive
    description: >
      Internal adversary simulation — red team exercises, breach and attack
      simulation, and supporting tooling.
    why: >
      Validates that detection and prevention controls actually work against
      realistic attack scenarios.

  - id: awareness.security-awareness-training
    name: Security Awareness Training
    domain: awareness
    description: >
      Staff education on secure practices, threat recognition, and security
      policies.
    why: >
      Humans are the most common attack vector — training reduces phishing
      success, credential misuse, and policy violations.

  - id: data-security.data-classification
    name: Data Classification & Discovery
    domain: data-security
    description: >
      Identifying, labelling, and inventorying sensitive data across all storage
      systems, including posture monitoring.
    why: >
      You cannot protect data you have not identified — classification is the
      foundation of data security.

  - id: data-security.dlp
    name: Data Loss Prevention (DLP)
    domain: data-security
    description: >
      Preventing unauthorized exfiltration of sensitive data from corporate
      systems.
    why: >
      Protects against insider threats and accidental data leaks that could
      trigger regulatory action.

  - id: data-security.backup-dr
    name: Backup & Disaster Recovery
    domain: data-security
    description: >
      Backup procedures and disaster recovery plans for critical systems.
    why: >
      Last line of defense against ransomware and catastrophic failure.
