# Risk taxonomy — the controlled vocabulary risks are classified against.
#
# Two independent trees:
#   categories  what kind of risk it is, as principle > category1 > category2.
#               An RSK doc's risk_category must name a full valid path.
#   causes      why it happened. An RSK doc's root_causes name leaf slugs from
#               any group's items.
#
# This is a starting point, not a prescription: replace it with your own
# taxonomy. Keep slugs kebab-case and stable — documents reference them by
# slug, and renaming one breaks every risk that used it.

categories:
  operational-risk:
    label: "Operational Risk"
    children:
      information-security:
        label: "Information Security"
        children:
          unauthorised-access: "Unauthorised access"
          data-breach: "Data breach"
          service-disruption: "Service disruption"
      technology:
        label: "Technology"
        children:
          system-failure: "System failure"
          change-failure: "Change failure"

  compliance-risk:
    label: "Compliance Risk"
    children:
      regulatory:
        label: "Regulatory"
        children:
          control-failure: "Control failure"
          reporting-failure: "Reporting failure"

causes:
  people:
    label: "People"
    items:
      human-error: "Human error"
      insufficient-training: "Insufficient training"
      insider-action: "Insider action"

  process:
    label: "Process"
    items:
      missing-process: "No process defined"
      process-not-followed: "Process not followed"

  systems:
    label: "Systems"
    items:
      misconfiguration: "Misconfiguration"
      software-defect: "Software defect"
      unpatched-component: "Unpatched component"

  external:
    label: "External"
    items:
      third-party-failure: "Third-party failure"
      targeted-attack: "Targeted attack"

# ---------------------------------------------------------------------------
# Scoring. Severity is likelihood multiplied by impact, read off the bands
# below — it is never typed on a risk by hand, and `kilagen check` rejects a
# risk whose severity does not match its own scores.
#
# This is the single source for the heatmap and for any severity badge. The
# prose in your risk-framework standard explains what the numbers mean to
# your organisation; the numbers themselves live here.
severity:
  likelihood:
    - { value: 1, label: Negligible, note: Rare }
    - { value: 2, label: Low, note: Unlikely }
    - { value: 3, label: Medium, note: Possible }
    - { value: 4, label: High, note: Likely }
    - { value: 5, label: Critical, note: Highly likely }
  impact:
    - { value: 1, label: Negligible }
    - { value: 2, label: Low }
    - { value: 3, label: Medium }
    - { value: 4, label: High }
    - { value: 5, label: Critical }
  bands:
    - { id: negligible, min: 1, max: 1 }
    - { id: low, min: 2, max: 2 }
    - { id: medium, min: 3, max: 7 }
    - { id: high, min: 8, max: 14 }
    - { id: critical, min: 15, max: 25 }
