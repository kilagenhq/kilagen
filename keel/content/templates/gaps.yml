# Gaps register — open and remediated gaps: unapproved shortfalls against a specific STD-* requirement.
# See keel/design.md "Gaps register (gaps.yml)" for the field reference.
#
# A gap differs from an exception (EXC-*, an approved deviation) and from a
# finding (an untriaged tracker observation). The repo owns which gaps exist;
# the tracker owns their state. Closed gaps are retained, never deleted.
# The live register is program/gaps.yml; it starts as `gaps: []`.

gaps: []
  # - id: gap-mfa-not-enforced-admin-consoles      # kebab-case, unique, gap- prefix
  #   title: MFA not enforced on cloud admin consoles
  #   requirement: STD-access-control#3.2            # STD-<slug>#<number> — must resolve to a real requirement
  #   domain: iam                                    # grc | iam | infra | appsec | secops | ir | offensive | digital-assets | awareness | data-security
  #   owner: role-security-eng                       # role-* responsible for remediation
  #   source: audit                                  # risk-assessment | audit | pentest | bug-bounty | threat-model | internal
  #   severity: high                                 # negligible | low | medium | high | critical (inherited from STD-risk-framework)
  #   tracker_id: TS-000                             # immutable Jira issue key — the stable correlation key (unique per gap)
  #   tracker: https://your-org.atlassian.net/browse/TS-000   # Jira task tracking remediation
  #   opened: 2026-01-15                             # YYYY-MM-DD — date recorded
  #   status: open                                   # open | closed (mirrors the tracker)
  #   status_updated: 2026-01-15                     # YYYY-MM-DD — date status was last set
  #   # closed_at: 2026-03-01                        # optional — date the gap was closed
  #   # closure_note: Conditional access policy enforced org-wide   # optional — one-line resolution note
  #   related:                                       # optional — IDs keyed by type
  #     risks:      [RSK-customer-account-compromise] # RSK-*
  #     threats:    [THR-credential-stuffing]         # THR-*
  #     systems:    [SYS-okta]                        # SYS-*
  #     processes:  [PRO-access-management]           # PRO-*
  #     exceptions: [EXC-legacy-vpn-mfa]              # EXC-*
