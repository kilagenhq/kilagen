# Capabilities file for a security program domain.
# See keel/design.md "Capability model" and keel/maturity.md for reference.
#
# This file is the source of truth for what this domain covers and how well.
# The dashboard renders views from this data — no scorecard tables in README.md.
#
# Maturity = how well does it work? (L0-none | L1-ad-hoc | L2-defined | L3-integrated | L4-measured | L5-optimizing)
# L0 means nothing exists; L1+ means it exists at increasing sophistication.

domain: REPLACE-ME
backlog_link:                # optional — URL to the ticket board or filter for this domain's security backlog

capabilities:
  - id: example-capability-1
    name: Example Deployed Capability
    summary: >
      One-sentence definition of what this capability is.
    why: >
      Business justification for why this capability matters.
    maturity: L3-integrated   # wired into CI/pipelines, runs on every relevant change
    systems:
      - SYS-example-tool      # SYS-* IDs from /systems/ that implement this capability
    owner: security-eng
    scope: All production repositories and environments
    backlog_link:              # optional — URL to the ticket epic or filter for this capability's backlog
    last_reviewed: 2026-01-01

  - id: example-capability-2
    name: Example Gap Capability
    summary: >
      One-sentence definition of what this capability is.
    why: >
      Business justification for why this capability matters.
    maturity: L0-none         # no tooling or process exists
    systems: []               # empty — no tool deployed
    owner: security-eng
    scope: TBD — not yet scoped
    last_reviewed: 2026-01-01
