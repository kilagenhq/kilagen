# Lint markdown, spell-check, and validate this program's frontmatter schemas.
name: Lint & validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"

      # The major is pinned: a new one may require migrating this
      # program's content, which must be a deliberate act rather than
      # something a Monday morning CI run does. "kilagen update config"
      # raises the pin when you choose to move.
      - name: Install dependencies
        run: |
          pip install --quiet "kilagen<1"
          npm install -g markdownlint-cli2@0.17.2

      - name: Run markdownlint
        run: markdownlint-cli2

      - name: Run codespell
        run: codespell --config .codespellrc .

      - name: Validate frontmatter, capabilities and gaps schemas, and ID uniqueness
        run: kilagen check frontmatter

      # Checks on this program's own content, in tests/. They skip the areas
      # that have no content yet, so they are useful from day one.
      - name: Run program content tests
        run: python -m unittest discover -s tests

      - name: Check generated artifacts are up to date
        run: kilagen check artifacts
