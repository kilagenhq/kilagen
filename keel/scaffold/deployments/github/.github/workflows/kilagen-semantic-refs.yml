# Validate bidirectional cross-references between systems, capabilities, and documents.
name: Semantic references

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-refs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      # The major is pinned: a new one may require migrating this
      # program's content, which must be a deliberate act rather than
      # something a Monday morning CI run does. "kilagen update config"
      # raises the pin when you choose to move.
      - name: Install dependencies
        run: pip install --quiet "kilagen<1"

      - name: Validate cross-references
        run: kilagen check refs
