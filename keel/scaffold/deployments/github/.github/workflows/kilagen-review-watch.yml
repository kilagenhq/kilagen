# Weekly scan for documents past their next_review date.
name: Review watch

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-watch
  cancel-in-progress: true

jobs:
  review-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      # The major is pinned: a new one may require migrating this
      # program's content, which must be a deliberate act rather than
      # something a Monday morning CI run does. "kilagen update config"
      # raises the pin when you choose to move.
      #
      # Set the KILAGEN_SPEC repository variable to override the source —
      # a branch or commit of the framework, say, while a change to it is
      # being reviewed. The ref then acts as the pin. Repository variables
      # are settable only by those who could edit this file anyway.
      - name: Install dependencies
        run: pip install --quiet "${{ vars.KILAGEN_SPEC || 'kilagen<1' }}"

      - name: Check overdue reviews
        run: kilagen check reviews
