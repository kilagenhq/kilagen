# Weekly scan for what has fallen due: reviews, exceptions, open gaps.
# It never fails the repository — it opens or updates one issue with the list,
# which is what a weekly reminder should do.
name: Review watch

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: review-watch
  cancel-in-progress: true

jobs:
  review-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      # The major is pinned: a new one may require migrating this
      # program's content, which must be a deliberate act rather than
      # something a Monday morning CI run does. "kilagen update config"
      # raises the pin when you choose to move.
      #
      # Set the KILAGEN_SPEC repository variable to override the source —
      # a branch or commit of the framework, say, while a change to it is
      # being reviewed. The ref then acts as the pin. It is passed through
      # env rather than interpolated into the script: a ${{ }} expression
      # inside run: is substituted before the shell sees it, so whoever can
      # set the variable can run commands on the runner. Repository
      # variables are also not masked in logs, so never put a credential in
      # one — install from a private source with a token in `secrets`.
      - name: Install dependencies
        env:
          KILAGEN_SPEC: ${{ vars.KILAGEN_SPEC || 'kilagen<1' }}
        run: pip install --quiet "$KILAGEN_SPEC"

      # Branch on the exit code, not on the prose. `check reviews` returns 0
      # for nothing due and 1 for findings; anything else is a crash, and a
      # crash has to fail the job. Piping into tee would hand the step tee's
      # status instead — the default shell is `bash -e`, without pipefail — so
      # the one thing that tells anybody a review has fallen due would go on
      # reporting success after it stopped working.
      - name: Report what needs attention
        id: report
        shell: bash
        run: |
          set -uo pipefail
          kilagen check reviews > "$RUNNER_TEMP/review-watch.txt" && rc=0 || rc=$?
          cat "$RUNNER_TEMP/review-watch.txt"
          if [ "$rc" -gt 1 ]; then
            echo "::error::kilagen check reviews failed (exit $rc)"
            exit "$rc"
          fi
          if [ "$rc" -eq 1 ]; then
            echo "attention=true" >> "$GITHUB_OUTPUT"
          fi

      # gh ships with the runner. The issue is found by title, so the weekly
      # run updates the same one instead of filing a new issue every Monday.
      - name: Open or update the review issue
        if: steps.report.outputs.attention == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Review watch: items need attention"
        run: |
          gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty" > "$RUNNER_TEMP/issue"
          body="$(printf '%s\n\n```\n%s\n```\n' \
            "Generated by \`kilagen check reviews\` on $(date -u +%Y-%m-%d)." \
            "$(cat "$RUNNER_TEMP/review-watch.txt")")"
          number="$(cat "$RUNNER_TEMP/issue")"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
